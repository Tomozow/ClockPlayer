<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock Player - OBS Source</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="index.css">
  <style>
    body {
      align-items: flex-start;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
      min-height: 100vh;
    }
    .glass-container {
      margin: 20px;
    }
  </style>
</head>
<body class="theme-night" data-role="player">
  <div class="glass-container">
    
    <!-- Left Panel: Clock -->
    <section class="clock-section">
      <div id="date" class="date-display">----/--/-- ---</div>
      <div id="time" class="time-display">00:00:00</div>
      <div>
        <span id="active-period" class="active-period-badge">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span id="active-period-name">BGM設定なし</span>
        </span>
      </div>
    </section>

    <!-- Right Panel: Player Controls -->
    <section class="player-section">
      <div class="track-info">
        <h2 id="track-title" class="track-title">再生中の曲はありません</h2>
        <div id="track-folder" class="track-folder">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 10H8v-2h6v2zm4-4H8v-2h10v2z"/></svg>
          <span id="track-folder-name">フォルダ未設定</span>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div id="progress-wrapper" class="progress-bar-wrapper">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="time-durations">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-wrapper">
        <button id="btn-shuffle" class="control-btn" title="シャッフル再生">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="btn-prev" class="control-btn" title="前の曲">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="control-btn play-pause" title="再生/一時停止">
          <svg id="play-icon" class="icon-svg" viewBox="0 0 24 24" style="width: 28px; height: 28px;"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="control-btn" title="次の曲">
          <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
        </button>
      </div>

      <!-- Volume (Keep for JS compatibility, but visually hidden) -->
      <div class="volume-container" style="display: none;">
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
      </div>
    </section>

  </div>

  <script src="bgm_manifest.js"></script>
  <script src="config.js"></script>
  <script src="library.js"></script>
  <script src="index.js"></script>
</body>
</html>
