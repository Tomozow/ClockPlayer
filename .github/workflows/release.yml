# ローカル版に必要なファイルだけを ZIP にまとめて Release を作る。説明文には CHANGELOG.md の該当する版の項目を使う。
# 動かし方は2通り:
#   - v0.2.0 のようなタグを push する
#   - Actions の画面から「Run workflow」でタグ名を入れて実行する（実行した時点のコミットにタグを付ける）
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'タグ名（例: v0.2.0）'
        required: true

env:
  # 入力値はコマンドに直接埋め込まず、環境変数として渡す
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグ名は v0.2.0 の形にしてください: $TAG" >&2
            exit 1
          fi

      - name: Build zip
        run: |
          set -euo pipefail
          DIST="dist/ClockPlayer"
          FILES=(
            index.html index.css index.js obs.html library.js config.js favicon.svg
            server.ps1 start.bat start_background.bat stop_background.bat
            local_obs.html local_dock.html local.js
            README.html
          )
          rm -rf dist
          mkdir -p "$DIST"
          cp "${FILES[@]}" "$DIST/"
          # README.html のスクリーンショット
          mkdir -p "$DIST/docs"
          cp -r docs/manual "$DIST/docs/"
          # 初回起動の前に曲を入れられるよう、空の bgm フォルダも入れる
          for f in bgmA bgmB bgmC bgmD bgmE bgmF; do mkdir -p "$DIST/bgm/$f"; done
          (cd dist && zip -r -X "ClockPlayer-${TAG}.zip" ClockPlayer)
          unzip -l "dist/ClockPlayer-${TAG}.zip"

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # 「## [0.2.0]」から次の「## [」の手前までを取り出す
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md に ${VERSION} の項目がありません" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # タグがまだ無ければ、このコミットに付けて作る
          gh release create "$TAG" "dist/ClockPlayer-${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/notes.md
